name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14"
          terraform_wrapper: false

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: TF_ACC=1 go test ./... -count=1
        # The suite runs against an in-memory fake server; no Ravenna
        # credentials are involved. resource.UnitTest does not gate on TF_ACC,
        # which is set only for consistency with acceptance-test tooling.

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - uses: golangci/golangci-lint-action@v6

      - name: Lint markdown
        run: npx --yes markdownlint-cli2@0.23.2

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Generate docs
        run: |
          go run github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs@latest \
            generate --provider-name ravenna

      - name: Fail if docs are stale
        run: git diff --exit-code -- docs/

  spec-drift:
    runs-on: ubuntu-latest
    # Informational: upstream API changes should surface without blocking PRs
    # that are unrelated to them.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Compare vendored spec with live API
        run: ./scripts/spec-diff.sh
